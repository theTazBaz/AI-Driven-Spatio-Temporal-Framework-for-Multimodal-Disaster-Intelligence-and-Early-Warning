[project]
name = "disaster-intel"
version = "0.1.0"
description = "AI-Driven Spatio-Temporal Framework for Multimodal Disaster Intelligence and Early Warning"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tejas Bajaj" },
    { name = "Garv Mandloi" },
    { name = "Swaroop Raghavendra Rao" },
]
dependencies = [
    "clickhouse-connect>=1.11.0",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "redis>=5.0",
]

[project.scripts]
ingest = "disaster_intel.pipeline:main"
disaster-intel = "disaster_intel.pipeline:main"

[project.optional-dependencies]
geo = [
    "rasterio>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.11",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disaster_intel"]

# ── pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests — no network, no clock, no containers (< 10 s)",
    "contract: adapter and bus contract tests against recorded fixtures",
    "integration: tests requiring real containers (ClickHouse, Redis, Redpanda)",
    "perf: performance and storage budget tests",
    "live: tests hitting real external APIs (never run in CI)",
    "slow: tests using real model weights (never run in CI)",
]
addopts = "--strict-markers -q"

# ── ruff ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["disaster_intel"]

# ── mypy ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["disaster_intel"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["h3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rasterio.*"]
ignore_missing_imports = true
