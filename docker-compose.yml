# Increment 0 — Infrastructure services (memory-capped for laptop use).
# See plan.md § "Risks → Laptop resources" for rationale.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP
    # 1 GB, not 512 MB: the Increment 7 budget test (a full day for every cell) peaks above
    # 512 MB on the server even with 10k-row insert batches.
    mem_limit: 1g
    environment:
      # The image's passwordless `default` user only accepts connections from inside the
      # container, so host-side tests/code log in as this dev user (local development only).
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-disaster}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-disaster}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    mem_limit: 160m
    # Increment 9: the hot tier is state, not a disposable cache. allkeys-lru would silently
    # drop cells under memory pressure (every window read would then be wrong), so refuse
    # writes instead (noeviction). 5,930 cells x ~4 KB = ~25 MB, far below the limit.
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    ports:
      - "9092:9092"   # Kafka API
      - "9644:9644"   # Admin API
    mem_limit: 512m
    command:
      - redpanda start
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  clickhouse_data:
